<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>高中數位資源圖書館</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ===== 頂部列 ===== -->
<header class="topbar">
  <div class="wrap">
    <div class="brand">
      <div class="mark">📚</div>
      <div>
        <h1>高中數位資源圖書館</h1>
        <div class="sub">DIGITAL RESOURCE LIBRARY</div>
      </div>
    </div>
    <nav class="topnav">
      <a href="#sec-magazine">雜誌</a>
      <a href="#sec-ebook">電子書</a>
      <a href="#sec-audiobook">有聲書（小魯）</a>
      <a href="#sec-flybook">有聲書（飛聽）</a>
      <a href="#sec-newspaper">報紙</a>
      <a href="#">使用說明</a>
      <a href="#" class="login">登入</a>
    </nav>
  </div>
</header>

<!-- ===== 左側分類抽屜 ===== -->
<button class="cat-edge-tab" id="cat-toggle" title="展開分類瀏覽" aria-label="展開分類瀏覽">
  <span class="arrow">&#8250;</span>
</button>
<div class="cat-backdrop" id="cat-backdrop"></div>
<aside class="cat-drawer" id="cat-drawer">
  <div class="cat-drawer-head">
    <h2>分類瀏覽</h2>
    <button class="cat-close" id="cat-close" aria-label="關閉">&times;</button>
  </div>
  <div class="cat-drawer-body" id="cat-drawer-body"></div>
</aside>

<!-- ===== 搜尋區 ===== -->
<section class="hero">
  <div class="wrap">
    <form class="searchbox" onsubmit="return false;">
      <input id="q" type="search" placeholder="輸入書名、雜誌名或關鍵字" autocomplete="off">
      <button type="button" onclick="document.getElementById('q').dispatchEvent(new Event('input'))">查詢</button>
    </form>

    <!-- 分類 tab：在搜尋欄底下 -->
    <div class="tabs" id="tabs">
      <button data-t="all"       class="on">全部</button>
      <button data-t="magazine">雜誌</button>
      <button data-t="ebook">電子書</button>
      <button data-t="audiobook">有聲書（小魯）</button>
      <button data-t="flybook">有聲書（飛聽）</button>
      <button data-t="newspaper">報紙</button>
    </div>
  </div>


  <div class="stats">
    <div class="wrap">
      <span><b id="s-mag">0</b> 種雜誌</span>
      <span><b id="s-ebk">0</b> 冊電子書</span>
      <span><b id="s-aud">0</b> 個有聲書分類</span>
      <span><b id="s-news">0</b> 個新聞分類</span>
      <span><b>5</b> 個合作平台</span>
    </div>
  </div>
</section>

<!-- ===== 資源區塊 ===== -->
<div class="wrap">
  <div class="active-filter" id="active-filter">
    目前分類：<b id="active-filter-label"></b>
    <button id="active-filter-clear">清除篩選 ✕</button>
  </div>
</div>
<main class="wrap" id="main"></main>

<!-- ===== Modal ===== -->
<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <div class="m-cover"><img id="m-img" alt=""></div>
    <div class="m-body">
      <button class="m-close" onclick="closeModal()">&times;</button>
      <h3 id="m-title"></h3>
      <div class="m-author" id="m-author"></div>
      <div class="m-rows" id="m-rows"></div>
      <a class="m-go" id="m-go" target="_blank" rel="noopener">前往平台 →</a>
      <p class="m-note">＊ 使用與閱讀在原平台完成，本站僅提供統一查詢入口。</p>
    </div>
  </div>
</div>

<footer>
  <p>高中數位資源圖書館 — 整合 KONO 電子雜誌、The New York Times 電子報、TumbleBook 電子書、小魯數位有聲書、飛聽Book有聲書</p>
  <p>本頁為概念展示原型（Demo），資料取自各平台實際館藏</p>
</footer>

<script src="assets/data.js"></script>
<script src="app.js"></script>
</body>
</html>
